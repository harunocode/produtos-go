services:
  db:
    image: postgis/postgis:16-3.7
    environment:
      POSTGRES_DB: produtos_go
      POSTGRES_USER: produtosgo
      POSTGRES_PASSWORD: produtosgo
    ports:
      - "5432:5432"
    volumes:
      - produtos-go-db:/var/lib/postgresql/data
      - ./backend/produtos-go-api/database/001_esquema_demo.sql:/docker-entrypoint-initdb.d/001_esquema_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U produtosgo -d produtos_go"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: ./backend/produtos-go-api
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/produtos_go
      DB_USER: produtosgo
      DB_PASSWORD: produtosgo
      SECURITY_JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5500:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  produtos-go-db:
